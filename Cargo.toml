[package]
name = "rstrace"
version = "1.0.0"
edition = "2024"
rust-version = "1.85"
authors = [
    "Andrea Scaioli <andrea.scaioli@gmail.com>",
    "Marta Viola <martaviola1428@gmail.com>",
    "Isacco Forlani <isaccoforlani@gmail.com>",
]
description = "A physically based Monte Carlo path tracer with a scene description language"
license = "EUPL-1.2"
repository = "https://github.com/scaioo/RayTraceRS"
publish = false

[dependencies]
anyhow = "1.0"
image = "0.25"
approx = "0.5"
byteorder = "1.5"
clap = { version = "4.6", features = ["derive"] }
indicatif = "0.18"
tobj = "4.0"
rayon = "1.10"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
